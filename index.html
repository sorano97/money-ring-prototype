<!DOCTYPE html>
<html lang="ja">
<head>

<title>Money Ring プロトタイプ</title>

<style>
/* VOICE: 小学生向けおこづかいアプリ。既存Money Ringの見た目をそのまま再現
   IDEA: 実機アプリそのもの。PCではスマホ枠の中で動く
   PICTURE: 操作できるアプリ画面
   COLOUR and TYPE: 緑#199344、背景#E8F4EC、オレンジのタグ、ふえた=青/へった=赤。Noto Sans JP
   LAYOUT: 幅402pxの1カラム。下にタブ、上にヘッダー */
:root{color-scheme:light dark;--desk:light-dark(#dfe9e2,#18201b);--deskInk:light-dark(#2b3a30,#cfe0d4);
--g:#199344;--gl:#e8f4ec;--gs:#f3f9f5;--gm:#d1e9da;--ink:#192131;--sub:#525252;--mute:#8a8a8a;--line:#e5e5e5;--or:#f08300;--red:#dc2626;--blue:#2563eb}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--desk);color:var(--deskInk);font:16px/1.55 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px}
.side{max-width:300px;padding-top:40px}.side h1{font-size:32px;line-height:1.1;margin:0 0 12px;font-weight:700}.side p{font-size:14px;margin:0 0 10px}
.phone{width:402px;height:874px;border-radius:44px;background:var(--gl);color:var(--ink);overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 10px #10170f;display:flex;flex-direction:column;flex:none}

.sb{height:48px;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0;font:600 15px system-ui;flex:none}
.ah{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:14px}.av{width:32px;height:32px;border-radius:50%;background:var(--gm);display:grid;place-items:center}
.ahr{display:flex}.bell{position:relative}.bell b{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:600 11px system-ui;display:grid;place-items:center;padding:0 4px}
.hd{height:52px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;flex:none;padding:0 6px}
.hd h2{margin:0;text-align:center;font-size:16px;font-weight:500}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);border-radius:22px;flex:none}

.tabs{display:flex;flex:none;border-bottom:1px solid var(--gm)}

.tabs button.on{background:#fff;color:var(--g);font-weight:500;border-color:var(--g)}
.seg{display:flex;padding:8px 16px 0;flex:none;border-bottom:1px solid var(--gm)}
.seg button{flex:1;height:40px;border:0;background:none;font:500 16px "Noto Sans JP";color:#a3a3a3;cursor:pointer;border-radius:10px 10px 0 0}
.seg button.on{background:#fff;color:var(--ink)}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--gm);height:48px;flex:none;padding:0 8px}

.month b{font-size:18px;font-weight:500;color:var(--g)}
.body{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.body.flush{padding:0;gap:0}
.foot{flex:none;background:#fff;padding:12px 16px 14px;display:flex;gap:12px}
.nav{flex:none;background:#fff;display:flex;padding:6px 0 22px;border-radius:16px 16px 0 0;box-shadow:0 -2px 8px rgba(0,0,0,.05)}

.link{border:0;background:var(--gl);color:var(--g);font:500 14px "Noto Sans JP";border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%}
.tl{border:0;background:none;color:var(--blue);font:300 14px "Noto Sans JP";cursor:pointer;padding:8px 0;min-height:36px}

.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .4s}

.chip.on{background:var(--g);border-color:var(--g);color:#fff}.chip.blue.on{background:var(--blue);border-color:var(--blue)}.chip.red.on{background:var(--red);border-color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}.field>span{font-size:14px;font-weight:500}
input,textarea{font:300 16px "Noto Sans JP";color:var(--ink);background:#fff;border:1px solid #d4d4d4;border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:none;height:64px}
.note{background:var(--gs);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--sub);font-weight:300}.note.gray{background:#f5f5f5}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp .card{border:1.5px solid var(--g);padding:14px;gap:4px}.cmp .card.or{border-color:var(--or)}
.err{color:var(--red);font-size:12px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--gl);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--sub)}

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:4px;vertical-align:middle}
.msg{display:flex;flex-direction:column;gap:2px;max-width:78%}.msg.me{align-self:flex-end;align-items:flex-end}
.msg p{margin:0;padding:10px 14px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:14px;font-weight:300}
.msg.me p{background:var(--g);color:#fff;border-radius:16px 16px 4px 16px}
.toggle{width:50px;height:30px;border-radius:15px;border:0;background:#d4d4d4;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--g)}.toggle.on::after{left:24px}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:24px 0;font-weight:300;margin:0}
h3{margin:0;font-size:16px;font-weight:500}
.mcard{width:100%;aspect-ratio:1.55;border-radius:12px;background:linear-gradient(135deg,#d9d9d9,#f2f2f2);position:relative;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.mcard svg{position:absolute;right:-6%;bottom:0;height:88%;width:auto}.mcard span{position:absolute;left:16px;bottom:14px;color:#8a8a8a;font-weight:500;font-size:14px;z-index:1;background:rgba(240,240,240,.75);padding:2px 8px 4px;border-radius:8px}.mcard b{display:block;font:600 22px system-ui}
.wtab{display:flex;justify-content:center;gap:24px}.wtab button{width:64px;height:76px;border-radius:12px;border:0;background:#f5f5f5;font:500 12px "Noto Sans JP";color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.wtab button.on{background:var(--gl);color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}
.cashrow{display:flex;align-items:center;gap:12px}.cashrow .ic{width:40px;height:40px;border-radius:50%;background:var(--gl);display:grid;place-items:center}
.led{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}.led:last-child{border-bottom:0}
.led .d{font-size:14px;color:var(--sub);font-weight:300}.tag{font-size:11px;color:#fff;background:var(--or);border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:2px}.tag.c{background:#4c9a6a}
.tug{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}.tug i{display:block;height:100%}
.sec{background:#fff;padding:16px;display:flex;flex-direction:column;gap:6px}
.acc{border:0;background:none;display:flex;align-items:center;gap:8px;font:500 16px "Noto Sans JP";color:var(--ink);cursor:pointer;padding:16px 0 8px;width:100%;text-align:left}
.acc svg{transition:transform .2s}.acc.open svg{transform:rotate(90deg)}
.mis{background:#fff;border-radius:8px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.mis .t{font-size:14px;font-weight:500}.mis .dl{font-size:12px;color:var(--red);font-weight:300;white-space:nowrap}.mis .dsc{font-size:14px;color:#a3a3a3;font-weight:300}
.mrow{background:#fff;border-radius:12px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;min-height:56px;border:0;width:100%;font:300 16px "Noto Sans JP";color:var(--ink);cursor:pointer;text-align:left}
.ntc{background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}.ntc b{font-weight:500;font-size:15px}
</style>
</head>

const nid=()=>++S.seq;

 ym:[t0.getFullYear(),t0.getMonth()],bf:'all',open:{check:false,redo:true,today:true,next:true},
 form:blankForm(),rec:blankRec(),sim:{name:'',price:'',reason:'',src:'カード'},ans:[null,null,null],memo:''};

/* お金を動かす：収支をおこづかい帳に記録 */
function addLedger(title,amount,src,date=iso(today())){
 if(src==='カード')S.card+=amount;else S.cash+=amount;
 S.ledger.push({id:nid(),date,title,amount,src});
}
function pay(title,price,pref){ // prefで払う。足りなければもう一方とあわせる
 const other=pref==='カード'?'現金':'カード',have=x=>x==='カード'?S.card:S.cash;
 if(have(pref)>=price){addLedger(title,-price,pref);return pref}
 const a=have(pref);if(a>0)addLedger(title,-a,pref);addLedger(title,-(price-a),other);return'カード＋現金';
}
const sorted=()=>[...S.wishes].sort((a,b)=>LV[a.level]-LV[b.level]||a.id-b.id);
const rest=(w,b=bal())=>Math.max(0,w.price-b);
function plan(price,date,b=bal()){
 const r=Math.max(0,price-b);if(!r)return'いまのおこづかいで買えるよ';
 if(!date)return`あと ${fmt(r)}円`;
 const days=Math.round((new Date(date+'T00:00')-today())/864e5);
 if(days<0)return`あと ${fmt(r)}円（目標日をすぎたよ）`;
 const weeks=Math.max(1,Math.ceil(days/7));
 return`${jd(date)}までに 1週間 ${fmt(Math.ceil(r/weeks))}円ずつ ためると まにあうよ`;
}
const pending=()=>[...S.gaman.filter(g=>!g.review).map(g=>({k:'g'+g.id,type:'g',it:g})),...S.bought.filter(b=>!b.review).map(b=>({k:'b'+b.id,type:'b',it:b}))];
const unread=()=>S.notices.filter(n=>!n.read).length;
function notify(kind,title,body=''){S.notices.unshift({id:nid(),kind,title,body,date:iso(today()),read:false})}

let toastT;
function toast(t){const el=app.querySelector('.toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

 if(p>B)return`<div class="card"><span class="err" style="font-size:14px">おこづかいが ${fmt(p-B)}円 たりないよ。いまは買えないので、ほしいものリストに入れて ためてみよう</span></div>`;
 const have=V.sim.src==='カード'?S.card:S.cash;
 const opt=(t,b,cls)=>{const r=top?rest(top,b):0;return`<div class="card ${cls}"><span class="badge ${cls?'':'g'}">${t}</span><span class="small">のこるお金</span>${yen(b,'mid')}
  ${top?`<span class="small">${esc(top.name)}まで</span><b style="font-weight:500;color:${cls?'var(--or)':'var(--g)'}">${r?'あと '+fmt(r)+'円':'買える！'}</b>
  <div class="bar"><i style="width:${Math.min(100,b/top.price*100)}%;${cls?'background:var(--or)':''}"></i></div>`:''}</div>`};
 const others=sorted().filter(w=>w!==top);
 return`${have<p?`<div class="note gray">${V.sim.src}だけでは たりないので、のこりは ${V.sim.src==='カード'?'現金':'カード'}から はらうよ</div>`:''}
 <div class="cmp" style="margin-top:${have<p?12:0}px">${opt('いま かう',B-p,'or')}${opt('こんかいは まつ',B,'')}</div>
 ${others.length?`<div class="card" style="margin-top:12px"><span class="lbl">ほかの ほしいもの</span>${others.map(w=>{const a=rest(w,B-p),b=rest(w);return`<div><div style="font-size:14px;font-weight:500">${esc(w.name)}（${fmt(w.price)}円）</div>
 <div class="row small"><span style="color:var(--or)">かう → ${a?'あと'+fmt(a)+'円':'まだ買える'}</span><span style="color:var(--g)">まつ → ${b?'あと'+fmt(b)+'円':'まだ買える'}</span></div></div>`}).join('')}</div>`:''}`}

const QS={g:[['いまでも ほしい？',['ほしい','もういらない','わからない']],['まってみて どうだった？',['よかった','ざんねん','ふつう']],['つぎに 同じばめんなら？',['また まつ','かう','そのとき決める']]],
 b:[['買って よかった？',['よかった','ざんねん','ふつう']],['いまでも だいじ？',['だいじ','そうでもない','わからない']],['つぎに 同じばめんなら？',['また かう','まつ','そのとき決める']]]};
scr.review=()=>{
 if(V.review){const type=V.review[0],id=+V.review.slice(1),it=(type==='g'?S.gaman:S.bought).find(x=>x.id===id);
  if(!it){V.review=null;return scr.review()}
  const days=Math.max(0,Math.round((today()-new Date(it.date+'T00:00'))/864e5));
  return`${head('おかいもの ふりかえり','review')}
  <div class="body">
   <div class="card"><span class="badge ${type==='g'?'g':''}">${days?days+'日まえに':'きょう'}${type==='g'?' まったもの':' 買ったもの'}</span>
    <div class="row"><b style="font-size:18px;font-weight:500">${esc(it.name)}</b>${yen(it.price,'mid')}</div>
    ${it.reason?`<span class="small">そのときの りゆう：${esc(it.reason)}</span>`:''}</div>
   ${QS[type].map(([q,o],qi)=>`<div class="card"><h3>${qi+1}. ${q}</h3><div class="chips" role="group" aria-label="${q}">${o.map((l,oi)=>`<button class="chip ${V.ans[qi]===oi?'on':''}" data-act="ans" data-q="${qi}" data-o="${oi}" aria-pressed="${V.ans[qi]===oi}">${l}</button>`).join('')}</div></div>`).join('')}
   <label class="field"><span class="row">ひとこと <span class="small">なくてもOK</span></span><input data-m="1" value="${esc(V.memo)}" maxlength="60" placeholder="れい：家にあったおかしで まんぞくできた"></label>
   <div class="note">かっても まっても、どのこたえも まちがいじゃないよ。</div>
  </div>${foot(`<button class="btn" data-act="saverev" ${V.ans.includes(null)?'disabled':''}>ふりかえりを のこす</button>`)}`}
 const p=pending(),done=[...S.gaman.filter(g=>g.review).map(g=>['g',g]),...S.bought.filter(b=>b.review).map(b=>['b',b])];
 return`${head('おかいもの ふりかえり',['menu','home'].includes(V.from)?V.from:'list')}
 <div class="body">
  <span class="lbl">ふりかえりを まっているもの</span>
  ${p.length?p.map(x=>`<button class="card" style="border:0;text-align:left;cursor:pointer;font:inherit;color:inherit" data-act="openrev" data-k="${x.k}">
   <span class="badge ${x.type==='g'?'g':''}">${x.type==='g'?'まったもの':'買ったもの'}</span>
   <div class="row" style="width:100%"><b style="font-weight:500">${esc(x.it.name)}</b>${yen(x.it.price)}</div><span class="small">${jd(x.it.date)}</span></button>`).join(''):'<p class="empty">ぜんぶ ふりかえったよ</p>'}
  ${done.length?`<span class="lbl">ふりかえったもの</span>${done.map(([t,x])=>`<div class="card"><div class="row"><b style="font-weight:500">${esc(x.name)}</b>${yen(x.price)}</div>
   <span class="small">${QS[t].map(([q,o],i)=>o[x.review.a[i]]).join(' ・ ')}${x.review.memo?' ／ '+esc(x.review.memo):''}</span></div>`).join('')}`:''}
 </div>`};

scr.consult=()=>{const w=S.wishes.find(x=>x.id===V.consult);if(!w)return scr.list();return`
${head('おうちの人と そうだん','list')}
<div class="body">
 <div class="card"><div class="wish" style="grid-template-columns:56px 1fr"><div class="thumb">${I.gift}</div><div><div style="font-weight:500">${esc(w.name)}</div>${yen(w.price,'mid')}</div></div>
  ${w.reason?`<span style="font-size:14px;font-weight:300;color:var(--sub)">りゆう：${esc(w.reason)}</span>`:''}
  <span class="small">${esc(plan(w.price,w.date))}</span></div>
 <div class="card"><div class="row"><div><div style="font-size:14px;font-weight:500">おうちの人に 見せる</div><span class="small">見せたいものだけ えらべるよ</span></div>
  <button class="toggle ${w.shared?'on':''}" data-act="share" role="switch" aria-checked="${w.shared}" aria-label="おうちの人に見せる"></button></div></div>
 ${w.shared?`<div class="row"><span class="small">いま書く人</span><div class="chips" style="flex:0 0 220px"><button class="chip ${V.parent?'':'on'}" data-act="who" data-v="0">じぶん</button><button class="chip ${V.parent?'on':''}" data-act="who" data-v="1">おうちの人</button></div></div>
 ${w.chat.length?w.chat.map(m=>`<div class="msg ${m.from==='me'?'me':''}">${m.from==='me'?'':'<span class="small">おうちの人</span>'}<p>${esc(m.text)}</p></div>`).join(''):'<p class="empty">ほしいりゆうを つたえてみよう</p>'}`
 :'<p class="empty">「おうちの人に 見せる」をオンにすると、そうだんできるよ</p>'}
</div>
${w.shared?`<div class="foot" style="align-items:center"><input id="chatin" placeholder="${V.parent?'おうちの人として 書く':'メッセージを書く'}" maxlength="80" style="border-radius:22px;background:#f5f5f5;border-color:#f5f5f5"><button class="ib" style="background:var(--g)" data-act="send" aria-label="おくる">${I.send}</button></div>`:''}`};

function render(){
 const t=new Date();
 app.innerHTML=`<div class="sb"><span>${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}</span><span>● ● ●</span></div>${(scr[V.name]||scr.home)()}<div class="toast" role="status"></div>`;
 if(V.name==='add')document.getElementById('calc').innerHTML=calcHtml();
 if(V.name==='sim')updSim();
}
function updSim(){const box=document.getElementById('simres');if(!box)return;box.innerHTML=simHtml();
 const p=num(V.sim.price),n=V.sim.name.trim();
 document.getElementById('kaub').disabled=!(p>0&&p<=bal()&&n);document.getElementById('matsub').disabled=!(p>0&&n)}

/* ---------- events ---------- */
app.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.f){V.form[el.dataset.f]=el.value;document.getElementById('calc').innerHTML=calcHtml()}
 if(el.dataset.s){V.sim[el.dataset.s]=el.value;if(el.dataset.s!=='reason')updSim()}
 if(el.dataset.r)V.rec[el.dataset.r]=el.value;
 if(el.dataset.m)V.memo=el.value});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatin'){e.preventDefault();app.querySelector('[data-act=send]').click()}
 if(e.key==='Enter'&&e.target.closest('#addf')&&e.target.tagName==='INPUT')e.preventDefault()});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
 switch(a){
 case'go':{const to=b.dataset.to;
   if(to==='review'&&V.name==='review'&&V.review){V.review=null;render();break}
   const ex={};
   if(to==='sim'){ex.from=['list','book','record'].includes(V.name)?(V.name==='record'?'book':V.name):'home';ex.sim={name:'',price:'',reason:'',src:'カード'}}
   if(to==='review'){ex.review=null;ex.from=V.name}
   if(to==='record')ex.rec=blankRec();
   go(to,ex);break}
 case'wtab':V.wtab=b.dataset.v;render();break;
 case'month':{let [y,m]=V.ym;m+=+b.dataset.v;if(m<0){m=11;y--}if(m>11){m=0;y++}V.ym=[y,m];render();break}
 case'bf':V.bf=b.dataset.v;render();break;
 case'rdir':V.rec.dir=b.dataset.v;render();break;
 case'rsrc':V.rec.src=b.dataset.v;render();break;
 case'saverec':{const r=V.rec,amt=num(r.amount),er=document.getElementById('recerr');
   if(!amt||!r.title.trim()){er.hidden=false;er.textContent='いくらか と なにか を 入れてね';break}
   const have=r.src==='カード'?S.card:S.cash;
   if(r.dir==='minus'&&amt>have){er.hidden=false;er.textContent=`${r.src}は ${fmt(have)}円 しかないよ`;break}
   addLedger(r.title.trim(),r.dir==='plus'?amt:-amt,r.src,r.date||iso(today()));save();
   const d=new Date((r.date||iso(today()))+'T00:00');V.ym=[d.getFullYear(),d.getMonth()];go('book');toast('おこづかい帳に きろくしたよ');break}
 case'acc':V.open[b.dataset.v]=!V.open[b.dataset.v];render();break;
 case'mdone':{const m=S.missions.find(x=>x.id===id);m.status='check';V.open.check=true;save();render();toast('おうちの人に チェックを おねがいしたよ');break}
 case'mok':{const m=S.missions.find(x=>x.id===id);m.status='done';m.done=iso(today());addLedger('ミッション：'+m.name,m.reward,'カード');
   if(S.notify)notify('parent',`ミッション「${m.name}」がクリアになりました`,`${fmt(m.reward)}円が カードに入ったよ`);save();render();toast(`クリア！ ${fmt(m.reward)}円 ふえたよ`);break}
 case'mredo':{const m=S.missions.find(x=>x.id===id);m.status='redo';V.open.redo=true;if(S.notify)notify('parent',`ミッション「${m.name}」は やりなおしです`,'もういちど やってみよう');save();render();break}
 case'ntab':V.ntab=b.dataset.v;render();break;
 case'notify':S.notify=!S.notify;save();render();break;
 case'tab':V.tab=b.dataset.t;render();break;
 case'level':V.form.level=b.dataset.v;render();break;
 case'addwish':{const f=V.form,p=num(f.price),er=document.getElementById('adderr');
   if(!f.name.trim()||!p){er.hidden=false;er.textContent='なまえと ねだんを 入れてね';break}
   S.wishes.push({id:nid(),name:f.name.trim(),price:p,reason:f.reason.trim(),level:f.level,date:f.date,shared:false,chat:[]});save();
   V.form=blankForm();go('list',{tab:'wish'});toast('ほしいものリストに入れたよ');break}
 case'delwish':S.wishes=S.wishes.filter(w=>w.id!==id);save();render();toast('リストから けしたよ');break;
 case'buywish':{const w=S.wishes.find(x=>x.id===id);const used=pay(w.name,w.price,S.card>=w.price?'カード':'現金');
   S.bought.push({id:nid(),name:w.name,price:w.price,reason:w.reason,date:iso(today()),review:null});
   S.wishes=S.wishes.filter(x=>x.id!==id);save();render();toast(`${w.name}を 買ったよ（${used}）`);break}
 case'feel':{const g=S.gaman.find(x=>x.id===id);g.feel=g.feel===b.dataset.v?null:b.dataset.v;save();render();break}
 case'towish':{const g=S.gaman.find(x=>x.id===id);S.wishes.push({id:nid(),name:g.name,price:g.price,reason:g.reason,level:'けっこう',date:'',shared:false,chat:[]});save();render();toast('ほしいものリストに入れたよ');break}
 case'ssrc':V.sim.src=b.dataset.v;app.querySelectorAll('[data-act=ssrc]').forEach(x=>x.classList.toggle('on',x===b));updSim();break;
 case'kau':case'matsu':{const p=num(V.sim.price),n=V.sim.name.trim();if(!p||!n)break;
   if(a==='kau'){pay(n,p,V.sim.src);S.bought.push({id:nid(),name:n,price:p,reason:'',date:iso(today()),review:null})}
   else S.gaman.push({id:nid(),name:n,price:p,reason:V.sim.reason.trim(),date:iso(today()),feel:null,review:null});
   save();go('list',{tab:a==='kau'?'wish':'gaman'});toast(a==='kau'?`${n}を 買ったよ。おこづかい帳にも きろくしたよ`:`${n}を まつことにしたよ`);break}
 case'openrev':V.review=b.dataset.k;V.ans=[null,null,null];V.memo='';render();break;
 case'ans':V.ans[+b.dataset.q]=+b.dataset.o;render();break;
 case'saverev':{const type=V.review[0],it=(type==='g'?S.gaman:S.bought).find(x=>x.id===+V.review.slice(1));
   it.review={a:[...V.ans],memo:V.memo.trim()};if(type==='g')it.feel=V.ans[0]===0?'want':V.ans[0]===1?'nowant':it.feel;
   save();V.review=null;render();toast('ふりかえりを のこしたよ');break}
 case'consult':go('consult',{consult:id,parent:false});break;
 case'share':{const w=S.wishes.find(x=>x.id===V.consult);w.shared=!w.shared;save();render();break}
 case'who':V.parent=b.dataset.v==='1';render();break;
 case'send':{const inp=document.getElementById('chatin'),t=inp.value.trim();if(!t)break;
   const w=S.wishes.find(x=>x.id===V.consult);w.chat.push({from:V.parent?'parent':'me',text:t});
   if(V.parent&&S.notify)notify('parent',`「${w.name}」に おうちの人から コメント`,t);
   save();render();const bd=app.querySelector('.body');bd.scrollTop=bd.scrollHeight;document.getElementById('chatin').focus();break}
 case'allow':addLedger('おこづかい',500,'カード');save();render();toast('おこづかいが 500円 ふえたよ（カード）');break;
 case'reset':S=seed();save();V.form=blankForm();V.ym=[t0.getFullYear(),t0.getMonth()];render();toast('さいしょの じょうたいに もどしたよ');break;
 }});
render();
}
</script>
</body>
</html>
